# `prek run --all-files` applies every hook to all files. CI runs the same command.
# Local hooks call tools through `mise exec`, so that git hooks get the
# versions pinned in mise.toml.

default_install_hook_types = ["pre-commit", "commit-msg"]
# Without this, every hook also runs in the commit-msg stage.
default_stages = ["pre-commit"]

# The builtin hooks that need no project-specific arguments.
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "fix-byte-order-marker" },
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-illegal-windows-names" },
  { id = "check-merge-conflict" },
  { id = "check-symlinks" },
  { id = "destroyed-symlinks" },
  { id = "check-executables-have-shebangs" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-json" },
  { id = "check-json5" },
  { id = "check-jsonc" },
  # Key order in config files carries meaning, so the keys are not sorted.
  { id = "pretty-format-json", args = ["--autofix", "--no-sort-keys"] },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-xml" },
  { id = "check-vcs-permalinks" },
  { id = "detect-private-key" },
  { id = "forbid-new-submodules" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "golangci-fmt", name = "golangci-lint fmt", language = "system", entry = "mise exec -- golangci-lint fmt", pass_filenames = false, types = [
    "go",
  ] },
  # The core is OS-independent and the system code is darwin-only, so the
  # lint runs for both.
  { id = "golangci-lint-linux", name = "golangci-lint run (linux)", language = "system", entry = "env GOOS=linux mise exec -- golangci-lint run ./...", pass_filenames = false, types = [
    "go",
  ] },
  { id = "golangci-lint-darwin", name = "golangci-lint run (darwin)", language = "system", entry = "env GOOS=darwin mise exec -- golangci-lint run ./...", pass_filenames = false, types = [
    "go",
  ] },
  { id = "go-mod-tidy", name = "go mod tidy", language = "system", entry = "mise exec -- go mod tidy", pass_filenames = false, files = '(^|/)go\.(mod|sum)$|\.go$' },
  { id = "jactionlint", name = "jactionlint", language = "system", entry = "mise exec -- jactionlint", files = '^\.github/workflows/.*\.ya?ml$' },
  # Offline audits need no GitHub token, so the hook works the same in CI.
  { id = "zizmor", name = "zizmor", language = "system", entry = "mise exec -- zizmor --offline", files = '^\.github/workflows/.*\.ya?ml$' },
]

# The changelog parser checks the subject, so that every commit on main can
# go into the changelog.
[[repos]]
repo = "local"
hooks = [
  { id = "conventional-commit", name = "conventional commit (git-cliff)", language = "script", entry = "scripts/check-commit-msg.sh", stages = [
    "commit-msg",
  ] },
]
