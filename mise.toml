[tools]
git-cliff = "2.14.2"
go = "1.27.3"
"github:open-telemetry/weaver" = "0.28.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
golangci-lint = "2.15.0"
jactionlint = "2.3.0"
prek = "0.5.7"
# The local end-to-end VM needs a macOS host. CI sets MISE_DISABLE_TOOLS=tart.
tart = { version = "2.41.1", os = ["macos"] }
zizmor = "1.31.1"

[env]
# Base image of the end-to-end guest, pinned by digest. A registry mirror
# serves the same digest: override the host in mise.local.toml.
# renovate: datasource=docker depName=ghcr.io/cirruslabs/macos-golden-gate-base
TSUNDERLAY_VM_IMAGE = "ghcr.io/cirruslabs/macos-golden-gate-base@sha256:5302a9ea6cd68c059d00fa253fe75c8ebdf4e0dc8c45d4e136ecc6e7a4c02b70"

[tasks.lint]
run = "golangci-lint run ./..."

[tasks.test]
run = "go test -race ./..."

[tasks."e2e:build"]
description = "Compile the end-to-end test binary for darwin/arm64"
env = { GOOS = "darwin", GOARCH = "arm64", CGO_ENABLED = "0" }
run = "go test -c -tags e2e -o bin/e2e.test ./e2e"

[tasks.e2e]
description = "Run the end-to-end tests as root on this host. Use only on a disposable host (CI, VM)"
depends = ["e2e:build"]
run = '''
sudo env \
  TSUNDERLAY_E2E_DISPOSABLE="${TSUNDERLAY_E2E_DISPOSABLE:-}" \
  TSUNDERLAY_E2E_STRICT="${TSUNDERLAY_E2E_STRICT:-}" \
  ./bin/e2e.test -test.v
'''

# telemetry/manifest.yaml reads the semconv dependency from this archive.
# Change the version here and in the manifest together.
[tasks."telemetry:semconv"]
description = "Download the semconv archive that the telemetry registry depends on"
run = '''
set -eu
f=.cache/weaver/semconv-v1.43.0.tar.gz
sum=ec7886ff60f500814a6f72c9f4955fcd040c019745e6beccb0e61886feae8618
if [ -f "$f" ] && echo "$sum  $f" | shasum -a 256 -c --status; then exit 0; fi
mkdir -p "${f%/*}"
curl -fsSL -o "$f.tmp" https://github.com/open-telemetry/semantic-conventions/archive/refs/tags/v1.43.0.tar.gz
echo "$sum  $f.tmp" | shasum -a 256 -c --status
mv -f "$f.tmp" "$f"
'''

[tasks."vm:e2e:build"]
description = "Compile the end-to-end test binary with the guest-only tests for darwin/arm64"
env = { GOOS = "darwin", GOARCH = "arm64", CGO_ENABLED = "0" }
run = "go test -c -tags e2e,e2e_guest -o bin/e2e-guest.test ./e2e"

[tasks."vm:e2e"]
description = "Run all end-to-end tests in a headless tart guest. Clone and start the guest when necessary"
depends = ["vm:e2e:build"]
usage = 'arg "[vm]" help="Name of the tart guest" default="tsunderlay-e2e"'
# The guest-only tests add global routes (0/1, 128/1), so they run only in
# the guest. The base image has passwordless sudo and the tart guest agent,
# which `tart exec` needs. `tart exec` does not use the guest network, so it
# keeps working while those routes are in place. The guest sees the
# repository read-only at /Volumes/My Shared Files/tsunderlay.
run = '''
vm="${usage_vm}"
if ! tart list --quiet --source local | grep -qx "$vm"; then
  tart clone "$TSUNDERLAY_VM_IMAGE" "$vm"
fi
if ! tart exec "$vm" true 2>/dev/null; then
  nohup tart run --no-graphics --dir="tsunderlay:{{config_root}}:ro" "$vm" \
    >"{{config_root}}/bin/$vm.log" 2>&1 &
  tries=0
  until tart exec "$vm" true 2>/dev/null; do
    tries=$((tries + 1))
    if [ "$tries" -ge 90 ]; then
      echo "guest $vm is not ready after 180 s; see bin/$vm.log" >&2
      exit 1
    fi
    sleep 2
  done
fi
# The guest agent's PATH does not include /sbin, where ifconfig and route are.
tart exec "$vm" sudo env \
  PATH=/usr/bin:/bin:/usr/sbin:/sbin \
  TSUNDERLAY_E2E_DISPOSABLE=1 \
  TSUNDERLAY_E2E_STRICT=1 \
  "/Volumes/My Shared Files/tsunderlay/bin/e2e-guest.test" -test.v
'''
