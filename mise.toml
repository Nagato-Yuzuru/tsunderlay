[tools]
git-cliff = "2.14.2"
go = "1.27.3"
"github:open-telemetry/weaver" = "0.28.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
golangci-lint = "2.15.0"
jactionlint = "2.3.0"
prek = "0.5.7"
# The local end-to-end VM needs a macOS host. CI sets MISE_DISABLE_TOOLS=tart.
tart = { version = "2.41.1", os = ["macos"] }
zizmor = "1.31.1"

[env]
# Base image of the end-to-end guest, pinned by digest. A registry mirror
# serves the same digest: override the host in mise.local.toml.
# renovate: datasource=docker depName=ghcr.io/cirruslabs/macos-golden-gate-base
TSUNDERLAY_VM_IMAGE = "ghcr.io/cirruslabs/macos-golden-gate-base@sha256:5302a9ea6cd68c059d00fa253fe75c8ebdf4e0dc8c45d4e136ecc6e7a4c02b70"

[tasks.lint]
run = "golangci-lint run ./..."

[tasks.test]
run = "go test -race ./..."

[tasks."e2e:build"]
description = "Compile the end-to-end test binary and the tsunderlay binaries that it installs, for darwin/arm64"
env = { GOOS = "darwin", GOARCH = "arm64", CGO_ENABLED = "0" }
# The install test upgrades from tsunderlay to tsunderlay-next. Only the
# build ID makes their bytes differ.
run = [
  "go test -c -tags e2e -o bin/e2e.test ./e2e",
  "go build -o bin/tsunderlay .",
  "go build -ldflags=-buildid=e2e-next -o bin/tsunderlay-next .",
]

[tasks.e2e]
description = "Run the end-to-end tests as root on this host. They run only when the root-owned file /var/db/tsunderlay-e2e-disposable marks the host as disposable (CI, VM)"
depends = ["e2e:build"]
# The tests whose names start with TestInstall run alone, after the other
# tests. The daemon that they install deletes owned routes, so a daemon that
# their cleanup cannot stop must not run during another test. This task does not create the marker file, so
# the tests do not change a host that nothing marked as disposable.
run = '''
e2e() {
  sudo env \
    TSUNDERLAY_E2E_STRICT="${TSUNDERLAY_E2E_STRICT:-}" \
    TSUNDERLAY_E2E_BINARY="{{config_root}}/bin/tsunderlay" \
    TSUNDERLAY_E2E_BINARY_NEXT="{{config_root}}/bin/tsunderlay-next" \
    ./bin/e2e.test -test.v "$@"
}
status=0
e2e -test.skip '^TestInstall' || status=$?
e2e -test.run '^TestInstall' || status=$?
exit "$status"
'''

# The semconv version comes from the schema_url of the dependency in
# telemetry/manifest.yaml. The registry_path in the manifest must name the
# archive of that version, so a version change in one line only fails here.
# The sum is that of the archive of that version: a new version without a
# new sum fails the download.
#
# GitHub generates the tarball of a tag on request. GitHub does not promise
# stable bytes, so the sum can stop matching although the tag did not move.
# Then check the new archive and update the sum.
[tasks."telemetry:semconv"]
description = "Download the semconv archive that the telemetry registry depends on"
run = '''
set -eu
m=telemetry/manifest.yaml
sum=ec7886ff60f500814a6f72c9f4955fcd040c019745e6beccb0e61886feae8618
v=$(sed -n 's#^ *- schema_url: https://opentelemetry.io/schemas/##p' "$m")
f=.cache/weaver/semconv-v$v.tar.gz
if ! grep -qxF "    registry_path: $f[model]" "$m"; then
  echo "$m: the registry_path of semconv $v must be $f[model]" >&2
  exit 1
fi
if [ -f "$f" ] && echo "$sum  $f" | shasum -a 256 -c --status; then exit 0; fi
mkdir -p "${f%/*}"
curl -fsSL -o "$f.tmp" "https://github.com/open-telemetry/semantic-conventions/archive/refs/tags/v$v.tar.gz"
echo "$sum  $f.tmp" | shasum -a 256 -c --status
mv -f "$f.tmp" "$f"
'''

# A generated file must match the registry and be in the index. git diff
# does not see a generated file that is untracked: a deleted file that the
# generate writes again, or a new output path of a template. Thus the
# check takes the paths from the output of the generate and fails on each
# path with a change in the working tree (git status column 2), untracked
# files included. A staged change passes, so the pre-commit hook passes
# after `git add` of the generated files. The templates read the v2
# context, so the generate needs --v2.
[tasks."telemetry:generate"]
description = "Generate attrs.go and docs/telemetry.md from the telemetry registry, and fail if a generated file is not in the index as generated"
depends = ["telemetry:semconv"]
run = '''
set -eu
out=$(mktemp -d)
trap 'rm -rf "$out"' EXIT
: >"$out/paths"
for t in go:. markdown:docs; do
  target=${t%%:*} dest=${t#*:}
  weaver registry generate --v2 --quiet -r telemetry -t telemetry/.templates "$target" "$out/$target"
  (cd "$out/$target" && find . -type f) | while IFS= read -r p; do
    p=${p#./}
    mkdir -p "$(dirname "$dest/$p")"
    cp "$out/$target/$p" "$dest/$p"
    printf '%s\0' "$dest/$p" >>"$out/paths"
  done
done
# Without paths, git status would report the whole repository.
if [ ! -s "$out/paths" ]; then
  echo "weaver generated no files" >&2
  exit 1
fi
xargs -0 git status --porcelain --untracked-files=all -- <"$out/paths" >"$out/status"
if awk 'substr($0, 2, 1) != " " { print; bad = 1 } END { exit !bad }' "$out/status"; then
  echo "A generated file above is not in the index as generated. Stage it." >&2
  exit 1
fi
'''

[tasks."vm:e2e:build"]
description = "Compile the end-to-end test binary with the guest-only tests, and the daemon that they run, for darwin/arm64"
env = { GOOS = "darwin", GOARCH = "arm64", CGO_ENABLED = "0" }
# The guest runs the install test too, so it needs the same binaries.
depends = ["e2e:build"]
run = "go test -c -tags e2e,e2e_guest -o bin/e2e-guest.test ./e2e"

[tasks."vm:e2e"]
description = "Run all end-to-end tests in a new headless tart guest. Delete the guest on a pass and keep it on a failure"
depends = ["vm:e2e:build"]
# Each run clones the pinned image to a new guest. Thus no state from an
# earlier run can change the result: not a daemon or an /etc/hosts line that
# an interrupted test left, and not a stale copy of a binary in the shared
# folder. The guest-only tests add global routes (0/1, 128/1), so they run
# only in the guest. The base image has passwordless sudo and the tart guest
# agent, which `tart exec` needs. `tart exec` does not use the guest network,
# so it keeps working while those routes are in place. The guest sees the
# repository read-only at /Volumes/My Shared Files/tsunderlay.
run = '''
vm="tsunderlay-e2e-$(date +%Y%m%d-%H%M%S)-$$"
log="{{config_root}}/bin/$vm.log"
# The guest runs as a background job, which ignores SIGINT. Thus the EXIT
# trap stops the guest on each exit, also after Ctrl-C.
finish() {
  rc=$?
  tart stop "$vm" >/dev/null 2>&1 || true
  if [ "$rc" -eq 0 ]; then
    tart delete "$vm"
    rm -f "$log"
  else
    echo "kept guest $vm (log: bin/$vm.log). Delete it with: tart delete $vm" >&2
  fi
}
trap finish EXIT
trap 'exit 130' INT
trap 'exit 143' TERM
tart clone "$TSUNDERLAY_VM_IMAGE" "$vm"
tart run --no-graphics --dir="tsunderlay:{{config_root}}:ro" "$vm" >"$log" 2>&1 &
tries=0
until tart exec "$vm" true 2>/dev/null; do
  tries=$((tries + 1))
  if [ "$tries" -ge 90 ]; then
    echo "guest $vm is not ready after 180 s" >&2
    exit 1
  fi
  sleep 2
done
# The guest is disposable, so the marker file goes into the guest only.
tart exec "$vm" sudo touch /var/db/tsunderlay-e2e-disposable
# The guest agent's PATH does not include /sbin, where ifconfig and route are.
# The TestInstall tests run alone, after the other tests, as in the e2e task.
e2e() {
  tart exec "$vm" sudo env \
    PATH=/usr/bin:/bin:/usr/sbin:/sbin \
    TSUNDERLAY_E2E_STRICT=1 \
    "TSUNDERLAY_E2E_BINARY=/Volumes/My Shared Files/tsunderlay/bin/tsunderlay" \
    "TSUNDERLAY_E2E_BINARY_NEXT=/Volumes/My Shared Files/tsunderlay/bin/tsunderlay-next" \
    "/Volumes/My Shared Files/tsunderlay/bin/e2e-guest.test" -test.v "$@"
}
status=0
e2e -test.skip '^TestInstall' || status=$?
e2e -test.run '^TestInstall' || status=$?
exit "$status"
'''

# The registry check sees only the registry, not the keys in the code. This
# task makes the daemon emit each event kind and checks each attribute name
# against the registry. A name that is not in it is a violation, and weaver
# then exits non-zero. Without --v2, weaver searches the whole resolved
# registry: the tsunderlay attributes and the semconv attributes that it
# references. With --v2, a text sample has no signal to match, so each name
# is missing unless --search-all-attributes also accepts each semconv name.
[tasks."telemetry:live-check"]
description = "Check the log attribute names of the daemon against the telemetry registry"
depends = ["telemetry:semconv"]
run = '''
set -eu
f=$(mktemp)
trap 'rm -f "$f"' EXIT
TSUNDERLAY_LIVECHECK_OUT="$f" go test -count=1 -v -run '^TestLogAttributes$' .
weaver registry live-check -r telemetry --input-source "$f" --input-format text
'''
