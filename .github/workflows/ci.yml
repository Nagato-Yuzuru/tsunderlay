name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI does not start a VM, so it does not need tart.
  MISE_DISABLE_TOOLS: tart
  # Renovate updates mise.lock itself. A lock that does not agree with
  # mise.toml fails the install, so that a mise update can merge without
  # a review. Without this, mise-action repairs the lock and hides it.
  MISE_LOCKED: "1"
  MISE_NO_HOOKS: "1"

jobs:
  check:
    name: check (hooks, lint, format)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - run: prek run --all-files

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The system code is darwin-only. On linux, go test sees only the
        # OS-independent core, so a core change that needs macOS fails here.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      # go test reuses the result of a package whose test binary did not
      # change, so a PR runs only the tests that its change can affect.
      - id: gocache
        run: echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.gocache.outputs.dir }}
          key: gocache-${{ runner.os }}-${{ github.sha }}
          restore-keys: gocache-${{ runner.os }}-
      - run: go test -race ./...
      # The daemon code is darwin-only, so only macOS can emit its events.
      - if: ${{ matrix.os == 'macos-latest' }}
        run: mise run telemetry:live-check

  e2e:
    name: e2e (macOS, root)
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      # Strict mode turns an unmet requirement into a failure, so that a
      # broken runner cannot pass as a skip.
      TSUNDERLAY_E2E_STRICT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      # The runner is disposable. The e2e task does not create the marker
      # file, so this job creates it.
      - run: sudo touch /var/db/tsunderlay-e2e-disposable
      - run: mise run e2e

  # The only required check of this workflow. It passes only when each job
  # in needs succeeded. No job has a condition, so each other result fails
  # it, also a result that is neither "failure" nor "cancelled", for example
  # that of a job that no runner took. A new job must be added to needs.
  ci-ok:
    needs: [check, test, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=$(printf '%s' "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"')
          if [ -n "$failed" ]; then
            echo "::error::A needed job did not succeed"
            printf '%s\n' "$failed"
            exit 1
          fi
