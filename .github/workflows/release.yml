# The owner pushes a signed tag vX.Y.Z on main. This workflow checks the
# tag, builds a universal darwin binary from it with a provenance
# attestation, and makes a draft GitHub Release with the binary and the
# notes that git-cliff generates. The owner edits the draft and publishes
# it. The workflow makes no tag. Each run replaces the notes of the draft.
#
# A manual run from main takes an existing tag, for example a tag that an
# older version of this workflow handled. It builds from the tag and
# updates its draft. It does not move the tag: the Go module proxy keeps the
# content of each version that it fetched. The attestation of a manual run
# names main as its source ref, because main holds the workflow that ran.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing version tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

env:
  MISE_LOCKED: "1"
  MISE_NO_HOOKS: "1"
  TAG: ${{ inputs.tag || github.ref_name }}

# A release must not stop half way, so a second run for the same tag waits.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The attestation names the workflow file and the ref that ran it, so
      # only the workflow on main may build a release.
      - name: Check the ref of a manual run
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Run this workflow from main, not from $GITHUB_REF"
            exit 1
          fi
      # Semver 2.0.0 with the prefix v, without build metadata: go build
      # records no version for a tag with a + part. A tag with a pre-release
      # part makes a pre-release.
      - name: Check the tag name
        shell: bash
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if ! [[ $TAG =~ $semver ]]; then
            echo "::error::The tag $TAG is not a semver version with the prefix v"
            exit 1
          fi
      # Only an annotated tag has a signature. The API reports whether GitHub
      # verified the signature with a key of the tagger's account.
      - name: Check the tag signature
        run: |
          object=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object | "\(.type) \(.sha)"')
          type=${object% *} sha=${object#* }
          if [ "$type" != tag ]; then
            echo "::error::The tag $TAG is not an annotated tag. Use git tag -s"
            exit 1
          fi
          verification=$(gh api "repos/$GH_REPO/git/tags/$sha" --jq '.verification | "\(.verified) \(.reason)"')
          verified=${verification%% *} reason=${verification#* }
          if [ "$verified" != true ]; then
            echo "::error::GitHub did not verify the signature of the tag $TAG: $reason"
            exit 1
          fi
      # A published release belongs to its readers: the workflow changes
      # only a draft. Check before the build, not after it.
      - name: Check that the release is not published
        run: |
          if state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1); then
            if [ "$state" != true ]; then
              echo "::error::The release $TAG is published. Change it by hand"
              exit 1
            fi
          elif [ "$state" != "release not found" ]; then
            echo "::error::Cannot read the release $TAG: $state"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check that the tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$TAG^{commit}" FETCH_HEAD; then
            echo "::error::The tag $TAG is not on main"
            exit 1
          fi

  build:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      # A tag run must not restore a cache that another run wrote.
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: go
          cache: false
      # go build at a clean checkout of the tag records the tag as the
      # module version, which --version prints. The Go linker signs the
      # arm64 slice ad hoc; Apple silicon runs no unsigned code.
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for arch in arm64 amd64; do
            GOOS=darwin GOARCH=$arch go build -trimpath -o "$RUNNER_TEMP/tsunderlay-$arch" .
          done
          lipo -create -output dist/tsunderlay "$RUNNER_TEMP/tsunderlay-arm64" "$RUNNER_TEMP/tsunderlay-amd64"
          codesign --verify --arch arm64 dist/tsunderlay
          got=$(dist/tsunderlay --version)
          if [ "$got" != "tsunderlay version $TAG" ]; then
            echo "::error::The binary reports \"$got\", not the version $TAG"
            exit 1
          fi
      # The asset names have no version, so that a link to
      # releases/latest/download/<name> stays valid. --no-xattrs keeps the
      # extended attributes of the runner out of the archive.
      - name: Package
        working-directory: dist
        run: |
          tar --no-xattrs -czf tsunderlay-darwin-universal.tar.gz tsunderlay
          rm tsunderlay
          shasum -a 256 tsunderlay-darwin-universal.tar.gz > SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/tsunderlay-darwin-universal.tar.gz
            dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # The notes come from a job without a write token, because mise and
  # git-cliff run in it.
  notes:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      module: ${{ steps.module.outputs.module }}
    steps:
      # git-cliff needs the full history and all tags of the release, but
      # the configuration of this run: a manual run for an old tag uses the
      # current notes format.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          path: src
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cfg
          sparse-checkout: |
            cliff.toml
            mise.toml
            mise.lock
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: git-cliff
          cache: false
          working_directory: cfg
      - name: Generate the notes
        working-directory: cfg
        run: |
          mkdir -p "$RUNNER_TEMP/notes"
          git-cliff --repository ../src --config cliff.toml --current --output "$RUNNER_TEMP/notes/notes.md"
      - id: module
        run: printf 'module=%s\n' "$(sed -n 's/^module //p' src/go.mod)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: ${{ runner.temp }}/notes/
          if-no-files-found: error
          retention-days: 1

  draft:
    needs: [build, notes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: notes
      # verify refused a published release. A release that appears after it
      # makes create fail: no tag has two releases.
      - name: Create or update the draft
        run: |
          case "$TAG" in
            *-*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac
          if gh release view "$TAG" --json isDraft >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes/notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            # shellcheck disable=SC2086 # an empty $prerelease must vanish
            gh release create "$TAG" --draft --verify-tag --title "$TAG" \
              --notes-file notes/notes.md $prerelease dist/*
          fi
      # The tag is the Go release: go install can fetch the version before
      # the draft is published. The proxy fetches a version on the first
      # request for it, so this request makes the version available to
      # go install and pkg.go.dev at once. The proxy path writes each
      # upper-case letter as "!" and the lower case.
      - name: Fetch the version into the Go module proxy
        env:
          MODULE: ${{ needs.notes.outputs.module }}
        run: |
          escaped=$(printf '%s\n' "$MODULE" | sed 's/[A-Z]/!\L&/g')
          curl -fsS --retry 3 "https://proxy.golang.org/$escaped/@v/$TAG.info"
