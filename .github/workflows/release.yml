# The owner pushes a tag vX.Y.Z on main. This workflow makes the GitHub
# Release with the notes that git-cliff generates for that tag. It builds no
# binary. The operator installs with `go install ...@vX.Y.Z`.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# A release must not stop half way, so a second run waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  MISE_LOCKED: "1"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      # git-cliff and the main check need the full history and all tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        # A tag run must not restore a cache that another run wrote.
        with:
          install_args: git-cliff
          cache: false
      # Semver 2.0.0 with the prefix v. A tag with a pre-release part makes
      # a pre-release.
      - name: Check the tag name
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! printf '%s\n' "$TAG" | grep -Eq "$semver"; then
            echo "::error::The tag $TAG is not a semver version with the prefix v"
            exit 1
          fi
      - name: Check that the tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::The tag $TAG is not on main"
            exit 1
          fi
      - name: Generate the notes
        run: mise exec -- git-cliff --latest --output "$RUNNER_TEMP/notes.md"
      - name: Create the release
        run: |
          case "$TAG" in
            *-*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac
          # shellcheck disable=SC2086 # an empty $prerelease must vanish
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" $prerelease
