# The registry of the log attributes that tsunderlay emits.
file_format: definition_manifest/2.0
description: Log attributes of the tsunderlay daemon.
schema_url: https://github.com/Nagato-Yuzuru/tsunderlay/schemas/1.0.0
stability: development
dependencies:
  # The generated Go code imports the semconv package of this version.
  # `mise run telemetry:semconv` reads the version from the schema_url and
  # downloads the archive, so that Weaver does not clone the repository on
  # each run. The task fails if the registry_path does not name the archive
  # of that version. The path is relative to the working directory of
  # Weaver: the mise tasks and the hooks run Weaver in the repository root.
  # A .weaver.toml schema_url_overrides entry does not prevent the clone in
  # Weaver 0.28.0: it applies after the dependency is fetched.
  - schema_url: https://opentelemetry.io/schemas/1.43.0
    registry_path: .cache/weaver/semconv-v1.43.0.tar.gz[model]
